<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JKME — Plan d'action</title>
<link rel="icon" type="image/jpeg" href="jkme.jpg">
<link rel="apple-touch-icon" href="jkme.jpg">
<meta name="theme-color" content="#16324F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F9FA;
    --panel:#FFFFFF;
    --ink:#1E293B;
    --ink-soft:#94A3B8;
    --line:#E2E8F0;
    --lavande:#6366F1;
    --rose:#F43F5E;
    --menthe:#10B981;
    --peche:#F59E0B;
    --ciel:#0EA5E9;
    --jaune:#14B8A6;
    --navy:#6366F1;
    --gris:#F1F5F9;
    --shadow: 0 4px 14px rgba(30,41,59,0.06);
    --shadow-sm: 0 1px 4px rgba(30,41,59,0.05);
    --radius: 16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Plus Jakarta Sans', sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:32px 24px 60px;}

  /* HEADER */
  header{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    margin-bottom:30px; flex-wrap:wrap; padding-bottom:22px; border-bottom:1px solid var(--line);
  }
  .title-block{display:flex; align-items:center; gap:16px;}
  .badge-mark{width:48px; height:48px; flex:0 0 auto; border-radius:50%; object-fit:cover; border:2px solid var(--lavande);}
  h1{
    font-family:'Plus Jakarta Sans', sans-serif; font-weight:700; font-size:1.7rem; margin:0;
    letter-spacing:-0.01em; color:var(--ink);
  }
  header p{margin:4px 0 0; color:var(--ink-soft); font-weight:500; font-size:0.9rem; letter-spacing:0.02em;}

  /* TABS */
  .tabs-container{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:26px;}
  .tabs{display:flex; gap:4px; flex-wrap:wrap; background:var(--gris); padding:5px; border-radius:14px; width:fit-content;}
  .tab-btn{
    font-family:'Plus Jakarta Sans', sans-serif; font-weight:600; font-size:0.85rem;
    padding:8px 16px; border:none; border-radius:10px;
    background:transparent; color:var(--ink-soft); cursor:pointer; letter-spacing:0.01em;
    transition:background .15s ease, color .15s ease, box-shadow .15s ease;
    display:inline-flex; align-items:center; gap:6px;
  }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{color:var(--lavande); background:var(--panel); box-shadow:var(--shadow-sm);}
  .tab-btn .tab-del{font-size:0.7rem; opacity:0.6; padding:0 2px; border-radius:4px;}
  .tab-btn .tab-del:hover{opacity:1; background:var(--rose); color:#fff;}
  .tab-content{display:none;}
  .tab-content.active{display:block; animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .btn-add-tab{
    font-family:'Plus Jakarta Sans', sans-serif; font-weight:600; font-size:0.82rem;
    padding:8px 14px; border:1px dashed var(--line); border-radius:12px;
    background:var(--panel); color:var(--ink-soft); cursor:pointer;
    transition:all .15s ease;
  }
  .btn-add-tab:hover{border-color:var(--lavande); color:var(--lavande); background:var(--gris);}

  /* PANEL / CARD BASE */
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:22px;
  }

  /* ADD TASK FORM */
  .add-task-form{
    display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; align-items:stretch;
  }
  .add-task-form input[type=text], .add-task-form select{
    font-family:'Plus Jakarta Sans', sans-serif; font-weight:500; font-size:0.92rem;
    border:1px solid var(--line); border-radius:10px; padding:10px 14px; background:var(--panel); color:var(--ink);
  }
  .add-task-form input[type=text]{flex:1; min-width:200px;}
  .btn{
    font-family:'Plus Jakarta Sans', sans-serif; font-weight:600; font-size:0.88rem;
    border:none; border-radius:12px; padding:10px 20px; cursor:pointer;
    background:var(--lavande); color:#FFFFFF; box-shadow:var(--shadow-sm); transition:transform .12s ease, opacity .15s ease;
    letter-spacing:0.01em;
  }
  .btn:hover{opacity:0.9; transform:translateY(-1px);}
  .btn:active{opacity:0.8; transform:translateY(0);}
  .btn-secondary{background:var(--menthe);}
  .btn-ghost{background:var(--gris); color:var(--ink); box-shadow:none;}

  /* KANBAN */
  .kanban{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  @media(max-width:800px){.kanban{grid-template-columns:1fr;}}
  .kanban-col{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; min-height:160px;}
  .kanban-col h3{font-family:'Plus Jakarta Sans', sans-serif; margin:0 0 14px; font-weight:600; font-size:1rem; display:flex; align-items:center; gap:8px; color:var(--ink);}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
  .task-card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px;
    margin-bottom:10px; box-shadow:none; position:relative; overflow:hidden;
    animation:fadeIn .3s ease; border-left:4px solid var(--cat-color);
  }
  .card-icons{position:absolute; top:10px; right:10px; display:flex; gap:4px;}
  .card-icons button{
    border:1px solid var(--line); background:var(--panel); border-radius:6px; cursor:pointer;
    font-size:0.72rem; padding:2px 7px; color:var(--ink-soft); line-height:1.5;
  }
  .card-icons button:hover{background:var(--gris); color:var(--ink);}
  .edit-title-input{
    display:block; width:100%; font-family:'Plus Jakarta Sans', sans-serif; font-weight:500; font-size:0.9rem;
    border:1px solid var(--ink); border-radius:6px; padding:6px 8px; margin:0 0 10px; padding-right:56px;
    background:var(--panel); color:var(--ink);
  }
  .chip{
    display:inline-flex; align-items:center; gap:6px; font-size:0.66rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--ink); background:var(--cat-color); border-radius:999px; padding:3px 10px; margin-bottom:8px;
    border:none; cursor:pointer; -webkit-appearance:none; appearance:none;
  }
  .chip:focus{outline:2px solid var(--ink); outline-offset:1px;}
  .task-card p{margin:0 0 10px; font-weight:500; font-size:0.9rem; line-height:1.35; color:var(--ink); padding-right:56px;}
  .card-actions{display:flex; gap:6px;}
  .card-actions button{
    border:1px solid var(--line); background:var(--panel); border-radius:6px; cursor:pointer;
    font-size:0.75rem; font-weight:600; padding:3px 8px; line-height:1.4; color:var(--ink-soft);
  }
  .card-actions button:hover{background:var(--gris); color:var(--ink);}
  .card-actions .del{margin-left:auto;}
  .empty-msg{color:var(--ink-soft); font-weight:500; font-size:0.83rem; font-style:italic; padding:10px 4px;}
  .cat-group-label{
    display:flex; align-items:center; gap:6px; font-size:0.66rem; font-weight:700; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--ink-soft); margin:14px 0 6px; padding-bottom:4px; border-bottom:1px dashed var(--line);
  }
  .cat-group-label:first-child{margin-top:0;}
  .cat-group-dot{width:8px; height:8px; border-radius:50%; background:var(--cat-color); flex:0 0 auto;}

  /* CALENDAR */
  .cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
  .cal-header h2{font-family:'Plus Jakarta Sans', sans-serif; margin:0; font-weight:700; font-size:1.25rem;}
  .cal-nav{display:flex; gap:8px;}
  .cal-nav button{
    border:1px solid var(--line); background:var(--panel); border-radius:8px; width:34px; height:34px;
    font-weight:600; font-size:0.95rem; cursor:pointer; color:var(--ink); box-shadow:none;
  }
  .cal-nav button:hover{background:var(--gris);}
  .cal-nav .today-btn{width:auto; padding:0 14px; font-family:'Plus Jakarta Sans',sans-serif; font-size:0.82rem;}

  .weekday-row{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px;}
  .weekday-row span{
    text-align:center; font-weight:600; font-size:0.68rem; text-transform:uppercase; color:var(--ink-soft); letter-spacing:0.08em;
  }
  .calendar-grid{
    display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:repeat(6,1fr);
    gap:6px; height:min(64vh, 560px); min-height:400px;
  }
  .cal-cell{
    border:1px solid var(--line); border-radius:8px; background:var(--panel);
    padding:5px 6px; display:flex; flex-direction:column; gap:2px; cursor:pointer; position:relative;
    transition:background .12s ease, border-color .12s ease; overflow:hidden;
  }
  .cal-cell.pad{visibility:hidden; cursor:default;}
  .cal-cell:not(.pad):hover{border-color:var(--ink); background:var(--gris);}
  .cal-cell .daynum{font-weight:600; font-size:0.78rem; color:var(--ink); flex:0 0 auto;}
  .cal-cell.today{background:var(--jaune); border:1px solid var(--ink);}
  .cal-cell.today .daynum{color:#FFFFFF; position:relative;}
  .cal-cell.has-events{background:var(--gris);}
  .cal-cell.today.has-events{background:var(--jaune); border:2px solid var(--menthe);}
  .ev-preview{
    font-size:0.62rem; font-weight:600; line-height:1.3; color:var(--ink);
    background:rgba(255,255,255,0.65); border-left:2px solid var(--ev-color, var(--lavande));
    border-radius:3px; padding:1px 4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:0 0 auto;
  }
  .ev-more{font-size:0.58rem; font-weight:600; color:var(--ink-soft); padding:0 4px; flex:0 0 auto;}

  /* NOTES */
  .notes-textarea{
    width:100%; min-height:56vh; border:none; outline:none; resize:vertical;
    font-family:'Plus Jakarta Sans', sans-serif; font-size:0.98rem; line-height:1.65; color:var(--ink); background:transparent;
  }
  .notes-textarea::placeholder{color:var(--ink-soft);}

  /* PROJET / PARTIS PRIS */
  .parti-form{display:flex; flex-direction:column; gap:10px; margin-bottom:24px; max-width:560px;}
  .parti-form input, .parti-form textarea{
    font-family:'Plus Jakarta Sans', sans-serif; font-weight:500; font-size:0.92rem;
    border:1px solid var(--line); border-radius:10px; padding:10px 14px; background:var(--panel); color:var(--ink);
  }
  .parti-form textarea{min-height:90px; resize:vertical;}
  .parti-form-actions{display:flex; gap:10px; align-items:center;}
  .parti-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:16px;}
  .parti-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 16px 16px 20px;
    box-shadow:var(--shadow-sm); position:relative; animation:fadeIn .3s ease;
  }
  .parti-card::before{content:""; position:absolute; top:0; left:0; width:5px; height:100%; background:var(--accent); border-radius:var(--radius) 0 0 var(--radius);}
  .parti-card h4{font-family:'Plus Jakarta Sans', sans-serif; margin:0 0 8px; font-size:1rem; font-weight:700; padding-right:54px; color:var(--ink);}
  .parti-card p{margin:0; font-size:0.87rem; line-height:1.55; color:var(--ink-soft); white-space:pre-wrap;}
  .parti-card .parti-actions{position:absolute; top:14px; right:14px; display:flex; gap:6px;}
  .parti-card .parti-actions button{border:1px solid var(--line); background:var(--panel); border-radius:6px; cursor:pointer; font-size:0.75rem; padding:3px 7px; color:var(--ink-soft);}
  .parti-card .parti-actions button:hover{background:var(--gris); color:var(--ink);}

  /* MODAL */
  .overlay{
    display:none; position:fixed; inset:0; background:rgba(42,39,51,0.4); z-index:50;
    align-items:center; justify-content:center; padding:20px;
  }
  .overlay.active{display:flex;}
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
    width:100%; max-width:440px; max-height:85vh; overflow-y:auto; padding:24px;
  }
  .modal h3{font-family:'Plus Jakarta Sans', sans-serif; margin:0 0 4px; font-weight:700; font-size:1.15rem;}
  .modal .close-x{
    float:right; border:1px solid var(--line); background:var(--panel); border-radius:8px; width:30px; height:30px;
    cursor:pointer; font-weight:600; color:var(--ink-soft);
  }
  .modal .close-x:hover{color:var(--ink); border-color:var(--ink);}
  .ev-item{
    border:1px solid var(--line); border-radius:8px; padding:9px 11px; margin-bottom:8px; background:var(--bg);
    display:flex; align-items:flex-start; gap:10px;
  }
  .ev-item .time{font-family:'Plus Jakarta Sans', sans-serif; font-weight:700; font-size:0.85rem; white-space:nowrap; color:var(--lavande);}
  .ev-item .info{flex:1;}
  .ev-item .info .t{font-weight:600; font-size:0.88rem;}
  .ev-item .info .n{font-size:0.78rem; color:var(--ink-soft);}
  .ev-item .del{border:1px solid var(--line); background:var(--panel); border-radius:6px; cursor:pointer; font-weight:600; padding:2px 8px; color:var(--ink-soft);}
  .ev-item .del:hover{color:var(--ink); border-color:var(--ink);}
  .modal form{margin-top:16px; display:flex; flex-direction:column; gap:8px;}
  .modal form label{font-size:0.7rem; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.06em;}
  .modal form input{
    font-family:'Plus Jakarta Sans', sans-serif; font-weight:500; border:1px solid var(--line); border-radius:8px; padding:9px 11px;
  }
  .modal-empty{color:var(--ink-soft); font-weight:500; font-size:0.83rem; font-style:italic; margin-bottom:6px;}

  /* CATEGORY MANAGEMENT */
  .cat-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);}
  .cat-row:last-child{border-bottom:none;}
  .cat-row input[type=color]{width:36px; height:36px; border:1px solid var(--line); border-radius:8px; padding:2px; cursor:pointer; background:var(--panel); flex:0 0 auto;}
  .cat-row input[type=text]{flex:1; font-family:'Plus Jakarta Sans', sans-serif; font-weight:500; font-size:0.88rem; border:1px solid var(--line); border-radius:8px; padding:7px 10px; background:var(--panel); color:var(--ink);}
  .cat-row .cat-del{border:1px solid var(--line); background:var(--panel); border-radius:6px; cursor:pointer; font-weight:600; padding:4px 9px; color:var(--ink-soft); flex:0 0 auto;}
  .cat-row .cat-del:hover{color:var(--ink); border-color:var(--ink);}
  #addCatForm{display:flex; gap:8px; align-items:center; margin-top:14px;}
  #addCatForm input[type=color]{width:44px; height:38px; border:1px solid var(--line); border-radius:8px; padding:2px; cursor:pointer; background:var(--panel); flex:0 0 auto;}
  #addCatForm input[type=text]{flex:1; font-family:'Plus Jakarta Sans', sans-serif; font-weight:500; font-size:0.88rem; border:1px solid var(--line); border-radius:8px; padding:9px 11px; background:var(--panel); color:var(--ink);}

  /* LOGIN SCREEN */
  #loginScreen{
    position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center;
    z-index:1000; padding:24px;
  }
  #loginScreen.hidden{display:none;}
  .login-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:40px 36px; max-width:380px; width:100%; text-align:center;
  }
  .login-card h1{
    font-family:'Plus Jakarta Sans', sans-serif; font-weight:700; font-size:1.5rem; margin:0 0 8px; color:var(--ink);
  }
  .login-card p{color:var(--ink-soft); font-weight:500; font-size:0.9rem; margin:0 0 24px;}
  .google-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:10px; width:100%;
    font-family:'Plus Jakarta Sans', sans-serif; font-weight:600; font-size:0.92rem;
    border:1px solid var(--line); border-radius:12px; padding:12px 18px; cursor:pointer;
    background:var(--panel); color:var(--ink); box-shadow:var(--shadow-sm);
  }
  .google-btn:hover{background:var(--gris);}
  .login-error{color:#B54D4D; font-size:0.82rem; font-weight:600; margin-top:14px; min-height:1em;}
  #appRoot.hidden{display:none;}
  .sync-status{
    display:flex; align-items:center; gap:10px; font-size:0.78rem; font-weight:600; color:var(--ink-soft);
  }
  .sync-status .dot-sync{width:7px; height:7px; border-radius:50%; background:var(--menthe); flex:0 0 auto;}
  .sync-status.saving .dot-sync{background:var(--jaune);}
  .sync-status.error .dot-sync{background:#B54D4D;}
  #signOutBtn{
    border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:6px 12px;
    font-family:'Plus Jakarta Sans', sans-serif; font-weight:600; font-size:0.78rem; cursor:pointer; color:var(--ink-soft);
  }
  #signOutBtn:hover{background:var(--gris); color:var(--ink);}
  .user-bar{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}

  /* SCÈNES & ÉDITEURS UNIFIÉS */
  .scene-pills{display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:18px; -webkit-overflow-scrolling:touch;}
  .scene-pill{
    flex:0 0 auto; font-family:'Plus Jakarta Sans', sans-serif; font-weight:600; font-size:0.85rem;
    padding:8px 15px; border:1px solid var(--line); border-radius:999px;
    background:var(--panel); color:var(--ink-soft); cursor:pointer; white-space:nowrap;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .scene-pill:hover{color:var(--ink); border-color:var(--ink);}
  .scene-pill.active{color:#FFFFFF; background:var(--jaune); border-color:var(--jaune);}
  .scene-pill.global{border-color:var(--peche); color:var(--ink-soft);}
  .scene-pill.global.active{background:var(--peche); color:#FFFFFF; border-color:var(--ink);}
  .scene-pill.partipris{border-color:var(--rose); color:var(--ink-soft);}
  .scene-pill.partipris.active{background:var(--rose); color:#FFFFFF; border-color:var(--ink);}
  .scene-pill.mecanisme{border-color:var(--lavande); color:var(--ink-soft);}
  .scene-pill.mecanisme.active{background:var(--lavande); color:#FFFFFF; border-color:var(--ink);}
  .scene-pill-sep{flex:0 0 auto; width:1px; background:var(--line); margin:2px 4px;}
  .scene-pill .dot-fill{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--menthe); margin-right:6px; opacity:0;}
  .scene-pill.filled .dot-fill{opacity:1;}
  
  .scene-editor-title{
    width:100%; font-family:'Plus Jakarta Sans', sans-serif; font-weight:700; font-size:1.15rem;
    border:none; border-bottom:1px solid var(--line); background:transparent; color:var(--ink);
    padding:6px 2px 12px; margin-bottom:14px;
  }
  .scene-editor-title:focus{outline:none; border-color:var(--ink);}
  .scene-toolbar{display:flex; align-items:center; gap:4px; margin-bottom:10px; flex-wrap:wrap;}
  .scene-toolbar button{
    font-family:'Plus Jakarta Sans', sans-serif; font-weight:600; font-size:0.78rem;
    border:1px solid var(--line); border-radius:8px; padding:6px 11px; cursor:pointer;
    background:var(--panel); color:var(--ink-soft); transition:background .15s ease, color .15s ease;
  }
  .scene-toolbar button:hover{background:var(--gris); color:var(--ink);}
  .scene-toolbar-sep{width:1px; align-self:stretch; background:var(--line); margin:0 4px;}
  .scene-editor-content{
    width:100%; min-height:420px; border:none; background:transparent;
    font-family:'Plus Jakarta Sans', sans-serif; font-size:0.98rem; line-height:1.65; color:var(--ink);
  }
  .scene-editor-content:focus{outline:none;}
  .scene-editor-content:empty:before{content:attr(data-placeholder); color:var(--ink-soft);}
  .scene-editor-content h2{font-size:1.35em; font-weight:700; margin:0.7em 0 0.3em; font-family:'Plus Jakarta Sans', sans-serif;}
  .scene-editor-content h3{font-size:1.12em; font-weight:700; margin:0.6em 0 0.25em; font-family:'Plus Jakarta Sans', sans-serif;}
  .scene-editor-content p{margin:0 0 0.6em;}
  
  .scene-image-box{
    width:120px; height:120px; border-radius:12px; border:1.5px dashed var(--line);
    display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden;
    position:relative; background:var(--gris); margin-bottom:6px;
  }
  .scene-image-box img{width:100%; height:100%; object-fit:cover; display:block;}
  .scene-image-box .placeholder-txt{font-size:0.74rem; font-weight:600; color:var(--ink-soft); text-align:center; padding:8px;}
  .scene-image-remove{
    position:absolute; top:5px; right:5px; background:rgba(20,20,20,0.6); color:#fff; border:none;
    border-radius:50%; width:20px; height:20px; font-size:11px; cursor:pointer; line-height:20px; padding:0;
  }
  .scene-image-hint{font-size:0.7rem; color:var(--ink-soft); margin:0 0 16px;}

  /* LIVRE (Visionneuse PDF double page / Magazine local) */
  .book-viewer{
    background:var(--gris); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);
  }
  .book-iframe{width:100%; height:80vh; min-height:500px; border:none; display:block; background:#fff;}

  /* MOBILE */
  @media(max-width:640px){
    input, select, textarea, button{font-size:16px;}
    .wrap{padding:16px 14px 40px;}
    header{gap:10px; margin-bottom:18px; padding-bottom:14px;}
    .title-block{gap:10px;}
    .badge-mark{width:36px; height:36px;}
    h1{font-size:1.25rem;}
    header p{font-size:0.76rem;}
    .user-bar{gap:8px; order:2;}
    .sync-status{font-size:0.68rem;}
    #signOutBtn{padding:5px 9px; font-size:0.7rem;}
    .tabs{gap:2px; margin-bottom:18px; width:100%;}
    .tab-btn{flex:1; padding:7px 12px; font-size:0.8rem;}
    .scene-editor-content{min-height:300px;}
    .book-iframe{height:65vh;}
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h1>JKME</h1>
    <p>Connecte-toi avec Google pour accéder à ton espace, en sécurité.</p>
    <button type="button" id="googleSignInBtn" class="google-btn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5h-1.9V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.8-.4-4.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 16.3 3 9.6 7.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 36.4 27 37 24 37c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.5 40.6 16.2 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.5l6.6 5.4C41.4 35.6 45 30.3 45 24c0-1.4-.1-2.8-.4-3.5z"/></svg>
      Se connecter avec Google
    </button>
    <p class="login-error" id="loginError"></p>
  </div>
</div>

<div class="wrap hidden" id="appRoot">

  <header>
    <div class="title-block">
      <img src="jkme.jpg" class="badge-mark" alt="JKME Logo">
      <div>
        <h1>JKME</h1>
        <p>Aider les femmes sous violence psychologique</p>
      </div>
    </div>
    <div class="user-bar">
      <div class="sync-status" id="syncStatus"><span class="dot-sync"></span><span id="syncStatusLabel">Synchronisé</span></div>
      <button type="button" id="signOutBtn">Se déconnecter</button>
    </div>
  </header>

  <div class="tabs-container">
    <div class="tabs" id="mainTabsList">
      <!-- Les onglets sont générés dynamiquement -->
    </div>
    <button type="button" class="btn-add-tab" id="addTabBtn">+ Ajouter un onglet</button>
  </div>

  <!-- PLAN D'ACTION -->
  <div class="tab-content" id="content-plan">
    <form class="add-task-form" id="addTaskForm">
      <input type="text" id="taskTitle" placeholder="Ex : Finaliser le script du chapitre 2..." required>
      <select id="taskCategory"></select>
      <button type="button" id="manageCatsBtn" class="btn btn-ghost">⚙ Catégories</button>
      <button type="submit" class="btn">+ Ajouter l'étape</button>
    </form>

    <div class="kanban">
      <div class="kanban-col">
        <h3><span class="dot" style="background:var(--ink-soft)"></span>À faire</h3>
        <div id="col-todo"></div>
      </div>
      <div class="kanban-col">
        <h3><span class="dot" style="background:var(--ciel)"></span>En cours</h3>
        <div id="col-doing"></div>
      </div>
      <div class="kanban-col">
        <h3><span class="dot" style="background:var(--menthe)"></span>Terminé</h3>
        <div id="col-done"></div>
      </div>
    </div>
  </div>

  <!-- CALENDRIER -->
  <div class="tab-content" id="content-cal">
    <div class="panel">
      <div class="cal-header">
        <h2 id="calMonthLabel">Mois</h2>
        <div class="cal-nav">
          <button id="prevMonth">‹</button>
          <button class="today-btn" id="todayBtn">Aujourd'hui</button>
          <button id="nextMonth">›</button>
        </div>
      </div>
      <div class="weekday-row">
        <span>Lun</span><span>Mar</span><span>Mer</span><span>Jeu</span><span>Ven</span><span>Sam</span><span>Dim</span>
      </div>
      <div class="calendar-grid" id="calGrid"></div>
    </div>
  </div>

  <!-- SCÈNES (Contient Global, Parti pris, Mécanisme et les scènes) -->
  <div class="tab-content" id="content-scenes">
    <div class="scene-pills" id="scenePills"></div>

    <div class="panel" id="sceneModeBlock">
      <div class="scene-image-box" id="sceneImageBox">
        <span class="placeholder-txt" id="sceneImagePlaceholder">+ Image</span>
        <button type="button" class="scene-image-remove" id="sceneImageRemoveBtn" style="display:none;">✕</button>
      </div>
      <input type="file" id="sceneImageInput" accept="image/*" style="display:none;">
      <div class="scene-image-hint">Image carrée, recadrée et compressée automatiquement (~5 Ko).</div>
      <input type="text" class="scene-editor-title" id="sceneTitleInput" placeholder="Titre de la scène">
      
      <div class="scene-toolbar" id="sceneToolbar">
        <button type="button" data-cmd="bold" title="Gras"><b>G</b></button>
        <button type="button" data-cmd="underline" title="Souligné"><u>S</u></button>
        <div class="scene-toolbar-sep"></div>
        <button type="button" data-cmd="formatBlock" data-value="H2" title="Titre">Titre</button>
        <button type="button" data-cmd="formatBlock" data-value="H3" title="Sous-titre">Sous-titre</button>
        <button type="button" data-cmd="formatBlock" data-value="P" title="Texte normal">Normal</button>
      </div>
      <div class="scene-editor-content" id="sceneContentInput" contenteditable="true" data-placeholder="Écris le contenu de cette scène ici : script, découpage, dialogues..."></div>
    </div>

    <div class="panel" id="globalModeBlock" style="display:none;">
      <textarea id="notesArea" class="notes-textarea" placeholder="Idées, pistes, notes en vrac sur ton roman graphique..."></textarea>
    </div>

    <!-- Section Parti pris -->
    <div id="partiModeBlock" style="display:none;">
      <form class="parti-form" id="addPartiForm">
        <input type="text" id="partiTitle" placeholder="Ex : Personnage principal" required>
        <textarea id="partiContent" placeholder="Ex : Il s'appellera LUI, un ancien libraire qui..." required></textarea>
        <div class="parti-form-actions">
          <button type="submit" class="btn" id="partiSubmitBtn">+ Ajouter le parti pris</button>
          <button type="button" class="btn btn-ghost" id="partiCancelBtn" style="display:none;">Annuler</button>
        </div>
      </form>
      <div class="parti-grid" id="partiGrid"></div>
    </div>

    <!-- Section Mécanisme (sous-onglet intégré) -->
    <div class="panel" id="mecanismeModeBlock" style="display:none;">
      <input type="text" class="scene-editor-title" id="mecanismeTitleInput" placeholder="Titre de la section mécanisme">
      <div class="scene-toolbar" id="mecanismeToolbar">
        <button type="button" data-cmd="bold" title="Gras"><b>G</b></button>
        <button type="button" data-cmd="underline" title="Souligné"><u>S</u></button>
        <div class="scene-toolbar-sep"></div>
        <button type="button" data-cmd="formatBlock" data-value="H2" title="Titre">Titre</button>
        <button type="button" data-cmd="formatBlock" data-value="H3" title="Sous-titre">Sous-titre</button>
        <button type="button" data-cmd="formatBlock" data-value="P" title="Texte normal">Normal</button>
      </div>
      <div class="scene-editor-content" id="mecanismeContentInput" contenteditable="true" data-placeholder="Décris ici les mécanismes de la violence psychologique, les schémas comportementaux..."></div>
    </div>
  </div>

  <!-- LIVRE -->
  <div class="tab-content" id="content-livre">
    <div class="book-viewer">
      <!-- Changement ici pour double page: #view=TwoPage -->
      <iframe id="bookIframe" class="book-iframe" src="jusqua-meteindre.pdf#view=TwoPage&pagemode=thumbs" allow="autoplay"></iframe>
    </div>
  </div>

  <div id="dynamicTabContents"></div>

</div>

</body>
</html>
